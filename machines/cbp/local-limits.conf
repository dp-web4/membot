# systemd drop-in for CBP's membot.service — install to:
#   ~/.config/systemd/user/membot.service.d/local-limits.conf
# then: systemctl --user daemon-reload && systemctl --user restart membot
#
# 2026-09-25, dp: "the cap is arbitrary."
#
# membot's MAX_TEXT_LENGTH (10,000 chars) and its 60-requests-per-60s rate limiter live under
# a "# --- Security Limits ---" header. They are PUBLIC-server limits, and this instance is
# not a public server: it is one trusted user's own memory, bound to loopback, reached by
# that user's own agent and tools.
#
# Measured while ingesting this seat's memory corpus into the cbp-memory cartridge:
#   * 86 of 140 documents were REFUSED for length, the largest 57,917 chars. The workaround
#     was to chop memories into parts — damage to the thing being stored, in service of a
#     number chosen for a threat model this box does not have.
#   * The limiter keys on client IP, so on loopback EVERY client shares one 60/minute budget.
#     A bulk ingest consumed the window and the save_cartridge call was throttled with it,
#     leaving 54 freshly embedded memories unsaved while the caller saw only "Rate limited".
#     A dropped save is data loss dressed as throttling.
#
# 400,000 chars holds the largest memory in this corpus (57,917) with room to grow; it is not
# an invitation to store arbitrary blobs. Loopback is exempt from the limiter by default in
# the code as of the same date — named here so the intent is visible at the deployment and
# not only in the source.
#
# A PUBLIC membot MUST NOT inherit this. If this instance is ever exposed beyond loopback,
# drop MEMBOT_MAX_TEXT_LENGTH and set MEMBOT_RATE_LIMIT_LOOPBACK=1.
[Service]
Environment=MEMBOT_MAX_TEXT_LENGTH=400000
Environment=MEMBOT_MAX_QUERY_LENGTH=8000
